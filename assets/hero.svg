<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07040f"/>
      <stop offset="55%" stop-color="#0f0826"/>
      <stop offset="100%" stop-color="#070b1c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="900" height="340" rx="18"/></clipPath>
    <style>
      .orb { animation: drift 12s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      #orb2 { animation-duration: 15s; animation-direction: alternate-reverse; }
      #orb3 { animation-duration: 18s; }
      @keyframes drift {
        0%   { transform: translate(0px, 0px) scale(1); }
        50%  { transform: translate(60px, -25px) scale(1.15); }
        100% { transform: translate(-40px, 20px) scale(0.95); }
      }
      .star { animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      #name { animation: rise 1.4s ease-out both, pulse 4s ease-in-out 1.4s infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .82; } }
      .fade { opacity: 0; animation: fade 1s ease-out forwards; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      #scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(360px); } }
      #bar { animation: sweep 3s ease-in-out infinite alternate; transform-origin: 450px 0; }
      @keyframes sweep { from { transform: scaleX(.3); opacity: .5; } to { transform: scaleX(1); opacity: 1; } }
      .corner { animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: .9; } 50% { opacity: .35; } }
      .dot { animation: live 1.6s ease-in-out infinite; }
      @keyframes live { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="340" fill="url(#bg)"/>

    <!-- animated glow orbs -->
    <g filter="url(#blur)">
      <circle id="orb1" class="orb" cx="200" cy="120" r="110" fill="#7c3aed" opacity=".55"/>
      <circle id="orb2" class="orb" cx="700" cy="230" r="120" fill="#2563eb" opacity=".45"/>
      <circle id="orb3" class="orb" cx="470" cy="60" r="80" fill="#c026d3" opacity=".35"/>
    </g>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle class="star" cx="60"  cy="40"  r="1.2" style="animation-delay:.2s"/>
      <circle class="star" cx="140" cy="290" r="1"   style="animation-delay:1.1s"/>
      <circle class="star" cx="250" cy="60"  r="1.4" style="animation-delay:2s"/>
      <circle class="star" cx="330" cy="300" r="1"   style="animation-delay:.6s"/>
      <circle class="star" cx="560" cy="35"  r="1.3" style="animation-delay:1.6s"/>
      <circle class="star" cx="620" cy="300" r="1"   style="animation-delay:.9s"/>
      <circle class="star" cx="760" cy="70"  r="1.5" style="animation-delay:2.4s"/>
      <circle class="star" cx="840" cy="280" r="1.1" style="animation-delay:.4s"/>
      <circle class="star" cx="860" cy="150" r="1"   style="animation-delay:1.8s"/>
      <circle class="star" cx="40"  cy="190" r="1.2" style="animation-delay:2.8s"/>
    </g>

    <!-- scanning line -->
    <rect id="scan" x="0" y="0" width="900" height="2" fill="#a78bfa" opacity=".12"/>

    <!-- corner brackets -->
    <g class="corner" stroke="#a78bfa" stroke-width="2" fill="none">
      <path d="M28 52 V28 H52"/>
      <path d="M848 28 H872 V52"/>
      <path d="M28 288 V312 H52"/>
      <path d="M848 312 H872 V288"/>
    </g>

    <!-- status pill -->
    <g class="fade" style="animation-delay:.2s">
      <rect x="370" y="38" width="160" height="26" rx="13" fill="#1e1238" stroke="#7c3aed" stroke-opacity=".6"/>
      <circle class="dot" cx="388" cy="51" r="4" fill="#22c55e"/>
      <text x="458" y="55.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#d8b4fe" letter-spacing="1.5">OPEN TO WORK</text>
    </g>

    <!-- name -->
    <text id="name" x="450" y="148" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="16" fill="url(#title)" filter="url(#glow)">YAN TELES</text>

    <!-- animated divider -->
    <rect id="bar" x="250" y="172" width="400" height="2" fill="url(#line)"/>

    <text class="fade" style="animation-delay:.7s" x="450" y="206" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#e9d5ff" letter-spacing="6">SOFTWARE ENGINEERING STUDENT</text>
    <text class="fade" style="animation-delay:1.1s" x="450" y="236" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#93c5fd" letter-spacing="3">JAVA · JAVASCRIPT · SQL · WEB DEVELOPMENT</text>
    <text class="fade" style="animation-delay:1.5s" x="450" y="282" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b7fb8" letter-spacing="2">&gt; UNILESTE · MINAS GERAIS, BRAZIL</text>
  </g>

  <rect x=".5" y=".5" width="899" height="339" rx="18" fill="none" stroke="#7c3aed" stroke-opacity=".35"/>
</svg>
