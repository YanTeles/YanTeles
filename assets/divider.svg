<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="20%" stop-color="#a855f7" stop-opacity=".6"/>
      <stop offset="80%" stop-color="#3b82f6" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c4b5fd" stop-opacity=".8"/>
