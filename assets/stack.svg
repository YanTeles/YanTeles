<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0616"/>
      <stop offset="100%" stop-color="#0b0f22"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="240" rx="16"/></clipPath>
    <clipPath id="barclip"><rect x="36" y="200" width="828" height="6" rx="3"/></clipPath>
    <style>
      text { font-family: Consolas, 'Courier New', monospace; }
      .chip { opacity: 0; animation: pop .6s ease-out forwards; }
      @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .ring { animation: glow 4.5s ease-in-out infinite; }
      @keyframes glow { 0%,100% { stroke-opacity: .25; } 15% { stroke-opacity: 1; } 35% { stroke-opacity: .25; } }
      .dot { animation: beat 2s ease-in-out infinite; }
      @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      #shine { animation: slide 3.5s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-200px); } to { transform: translateX(900px); } }
      #seg { transform-origin: 36px 0; transform: scaleX(0); animation: grow 1.6s ease-out .6s forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="240" fill="url(#bg)"/>

    <!-- header -->
    <rect x="36" y="32" width="4" height="16" rx="2" fill="#a855f7"/>
    <text x="50" y="45" font-size="14" font-weight="700" fill="#e9d5ff" letter-spacing="4">TECH STACK</text>
    <text x="864" y="45" text-anchor="end" font-size="11" fill="#6b5f95" letter-spacing="2">// always learning</text>

    <!-- row labels -->
    <text x="36" y="99"  font-size="11" fill="#8b7fb8" letter-spacing="2">LANGUAGES</text>
    <text x="36" y="155" font-size="11" fill="#8b7fb8" letter-spacing="2">TOOLS</text>

    <!-- row 1 -->
    <g font-size="13" fill="#e9d5ff">
      <g class="chip" style="animation-delay:.1s">
        <rect class="ring" style="animation-delay:0s" x="180" y="76" width="125" height="36" rx="18" fill="#140c2b" stroke="#f89820"/>
        <circle class="dot" cx="202" cy="94" r="5" fill="#f89820"/>
        <text x="216" y="98.5">Java</text>
      </g>
      <g class="chip" style="animation-delay:.2s">
        <rect class="ring" style="animation-delay:.5s" x="317" y="76" width="125" height="36" rx="18" fill="#140c2b" stroke="#f7df1e"/>
        <circle class="dot" cx="339" cy="94" r="5" fill="#f7df1e" style="animation-delay:.3s"/>
        <text x="353" y="98.5">JavaScript</text>
      </g>
      <g class="chip" style="animation-delay:.3s">
        <rect class="ring" style="animation-delay:1s" x="454" y="76" width="125" height="36" rx="18" fill="#140c2b" stroke="#e34f26"/>
        <circle class="dot" cx="476" cy="94" r="5" fill="#e34f26" style="animation-delay:.6s"/>
        <text x="490" y="98.5">HTML5</text>
      </g>
      <g class="chip" style="animation-delay:.4s">
        <rect class="ring" style="animation-delay:1.5s" x="591" y="76" width="125" height="36" rx="18" fill="#140c2b" stroke="#2965f1"/>
        <circle class="dot" cx="613" cy="94" r="5" fill="#2965f1" style="animation-delay:.9s"/>
        <text x="627" y="98.5">CSS3</text>
      </g>
      <g class="chip" style="animation-delay:.5s">
        <rect class="ring" style="animation-delay:2s" x="728" y="76" width="125" height="36" rx="18" fill="#140c2b" stroke="#4479a1"/>
        <circle class="dot" cx="750" cy="94" r="5" fill="#4479a1" style="animation-delay:1.2s"/>
        <text x="764" y="98.5">MySQL</text>
      </g>
    </g>

    <!-- row 2 -->
    <g font-size="13" fill="#e9d5ff">
      <g class="chip" style="animation-delay:.6s">
        <rect class="ring" style="animation-delay:2.5s" x="180" y="132" width="125" height="36" rx="18" fill="#140c2b" stroke="#f05032"/>
        <circle class="dot" cx="202" cy="150" r="5" fill="#f05032" style="animation-delay:.2s"/>
        <text x="216" y="154.5">Git</text>
      </g>
      <g class="chip" style="animation-delay:.7s">
        <rect class="ring" style="animation-delay:3s" x="317" y="132" width="125" height="36" rx="18" fill="#140c2b" stroke="#c9d1d9"/>
        <circle class="dot" cx="339" cy="150" r="5" fill="#c9d1d9" style="animation-delay:.5s"/>
        <text x="353" y="154.5">GitHub</text>
      </g>
      <g class="chip" style="animation-delay:.8s">
        <rect class="ring" style="animation-delay:3.5s" x="454" y="132" width="125" height="36" rx="18" fill="#140c2b" stroke="#a259ff"/>
        <circle class="dot" cx="476" cy="150" r="5" fill="#a259ff" style="animation-delay:.8s"/>
        <text x="490" y="154.5">Figma</text>
      </g>
      <g class="chip" style="animation-delay:.9s">
        <rect class="ring" style="animation-delay:4s" x="591" y="132" width="125" height="36" rx="18" fill="#140c2b" stroke="#007acc"/>
        <circle class="dot" cx="613" cy="150" r="5" fill="#007acc" style="animation-delay:1.1s"/>
        <text x="627" y="154.5">VS Code</text>
      </g>
    </g>

    <!-- colour bar with moving shine -->
    <g clip-path="url(#barclip)">
      <rect x="36" y="200" width="828" height="6" fill="#1e1238"/>
      <g id="seg">
        <rect x="36"  y="200" width="92" height="6" fill="#f89820"/>
        <rect x="128" y="200" width="92" height="6" fill="#f7df1e"/>
        <rect x="220" y="200" width="92" height="6" fill="#e34f26"/>
        <rect x="312" y="200" width="92" height="6" fill="#2965f1"/>
        <rect x="404" y="200" width="92" height="6" fill="#4479a1"/>
        <rect x="496" y="200" width="92" height="6" fill="#f05032"/>
        <rect x="588" y="200" width="92" height="6" fill="#c9d1d9"/>
        <rect x="680" y="200" width="92" height="6" fill="#a259ff"/>
        <rect x="772" y="200" width="92" height="6" fill="#007acc"/>
      </g>
      <rect id="shine" x="0" y="200" width="160" height="6" fill="url(#shine)"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="899" height="239" rx="16" fill="none" stroke="#7c3aed" stroke-opacity=".35"/>
</svg>
